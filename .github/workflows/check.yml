name: check

on:
  push:
  pull_request:

jobs:
  command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the command and installer
        run: |
          set -euo pipefail
          bash -n bin/vault-link
          bash -n install.sh
          bash bin/vault-link --help >/dev/null
          if bash bin/vault-link --bogus >/dev/null 2>&1; then
            echo "unknown option was accepted" >&2
            exit 1
          fi
          if bash bin/vault-link --check --repo "https://user:token@github.com/you/vault" >/dev/null 2>&1; then
            echo "credential URL was accepted" >&2
            exit 1
          fi
          if bash bin/vault-link --link-created >/dev/null 2>&1; then
            echo "--link-created accepted a missing vault source" >&2
            exit 1
          fi
      - name: Test explicit Vault-to-Project linking and idempotency
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/vault" "$tmp/project"
          printf '# Existing project rules\n' > "$tmp/project/AGENTS.md"
          git -C "$tmp/project" init -q
          bash bin/vault-link --link-created --local "$tmp/vault" "$tmp/project"
          test -f "$tmp/project/.vault-link-local"
          git -C "$tmp/project" check-ignore -q .vault-link-local
          test "$(grep -c '^<!-- vault-link:start -->$' "$tmp/project/AGENTS.md")" -eq 1
          test "$(grep -c '^<!-- vault-link:end -->          bash bin/vault-link --link-created --local "$tmp/vault" "$tmp/project"
          test "$(grep -c '^<!-- vault-link:start -->$' "$tmp/project/AGENTS.md")" -eq 1
          test "$(grep -c '^<!-- vault-link:end -->$' "$tmp/project/AGENTS.md")" -eq 1
 "$tmp/project/AGENTS.md")" -eq 1
          grep -q "### Work from either entry point" "$tmp/project/AGENTS.md"
          grep -q "### Shared completion state" "$tmp/project/AGENTS.md"
          grep -q "projects/<slug>/README.md" "$tmp/project/AGENTS.md"
          bash bin/vault-link --link-created --local "$tmp/vault" "$tmp/project"
          test "$(grep -c '^<!-- vault-link:start -->$' "$tmp/project/AGENTS.md")" -eq 1
          test "$(grep -c '^<!-- vault-link:end -->$' "$tmp/project/AGENTS.md")" -eq 1
